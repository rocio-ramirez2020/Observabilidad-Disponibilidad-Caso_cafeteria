services:
  # Base de datos centralizada compartida por las réplicas
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cafeteria_db
    ports:
      - "5432:5432"
    restart: always
    networks:
      - red-cafeteria

  # Primera réplica de nuestra API de stock
  stock-replica-1:
    build: .
    restart: unless-stopped
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - red-cafeteria

  # Segunda réplica de nuestra API de stock
  stock-replica-2:
    build: .
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql://admin:password123@postgres:5432/cafeteria_db
    depends_on:
      - postgres
    restart: always
    networks:
      - red-cafeteria

  # El Balanceador de Carga (NGINX)
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - stock-replica-1
      - stock-replica-2
    restart: always
    networks:
      - red-cafeteria

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - red-cafeteria

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - red-cafeteria

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - red-cafeteria

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yaml
    networks:
      - red-cafeteria

networks:
  red-cafeteria:
    driver: bridge