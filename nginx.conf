# Este archivo sirve para configurar el NGINX
events {}

http {
    # Definimos nuestro "grupo de trabajo" con las dos réplicas de la cafetería
    upstream cafeteria_cluster {
        server stock-replica-1:8000;
        server stock-replica-2:8000;
    }

    server {
        listen 80;

        # Todo lo que llegue a la puerta 80 será redirigido al grupo de réplicas
        location / {
            proxy_pass http://cafeteria_cluster;
        }
    }
}